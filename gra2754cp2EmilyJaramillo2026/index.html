body{
	margin:0;
	padding:0;
	background-color:#CCC;

	width:100%;

	margin:0 auto;

	background-color:#19B5E3;

	box-sizing:border-box;
	text-align:center;
	}
footer{
	height:80px;
	background-color:#19B5E3;
	clear:both;
	}
	#leek{
		animation: spinning 5s infinite linear;
	}
	@keyframes spinning{
		0%{transform: rotate(0deg);
		transform-origin: center;}
		100%{transform: rotate(360deg);
		transform-origin: center;}
	}
</style>
