<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Responsive Navigation | Emily Jaramillo, 2026</title>
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style type="text/css">
body {
    margin: 0;
	background-color: lightgreen;
}
wrapper {
    width: 80%;
    margin: auto;
    display: block;
    padding: 20px;
	background-color: rgba(255,255,255,0.50);
}
section {
	height: 500px;
}
nav a {
	color: white;
	text-decoration: none;
}
a li {
    padding: 15px;
    list-style-type: none;
    border-bottom: thin solid white;
}
a li:hover {
    background-color: green;
}
.topnav.responsive a{
    display:block;
}
.topnav.responsive a:not(:first-child) {
     display: none;
}
.topnav .fa-bars {
    display: none;
}
.topnav .fa-times {
    display: block;
}
.topnav.responsive .fa-bars {
    display: block;
}
.topnav.responsive .fa-times {
    display: none;
}
nav {
    background-color: darkgreen;
}
#myTopnav a {
    color: white;
}
#myTopnav {
    padding: 5px;
}
@media (min-width:600px) {
.topnav a:not(:first-child),.topnav.responsive a:not(:first-child) {
    display:inline-block;
     }
.topnav .fa.fa-bars {
     display:none;
     }
}
</style>
<script>
function myFunction() {
  var x = document.getElementById("myTopnav");
  if (x.className === "topnav") {
    x.className += " responsive";
  } else {
    x.className = "topnav";
  }
}
</script>
</head>

<body>
<wrapper>
  <header>
    <h1>(Insert Website Name Here)</h1>
	<nav class="topnav responsive" id="myTopnav">
		 <a href="javascript:void(0);" class="icon"
     onclick="myFunction()">
  <i class="fa fa-bars"></i><i class="fa fa-times"></i>
	
		  <a href="#home"><li>Home</li></a>
		  <a href="#services"><li>Services</li></a>
		  <a href="#contact"><li>Contact</li></a>
	
		</a>
	</nav>
  </header>
  <main>
	  <section id="home">
	    <h2>Home</h2>
	  </section>
	  <section id="services">
	    <h2>Services</h2>
	  </section>
    <section id="contact">
      <h2>Contact</h2>
    </section>
  </main>
  <footer></footer>
</wrapper>
</body>
</html>
